name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      - name: Unit tests (game math + registries)
        run: npm test
      - name: Build
        run: npm run build
      - name: Smoke test (boot + play in headless Chrome)
        # ubuntu runners ship Chrome; playwright-core channel "chrome" uses it.
        # Asserts: menu renders, run starts, countdown ticks, scene draws,
        # W moves the world, rigged gait animates, zero page errors.
        run: npm run smoke
